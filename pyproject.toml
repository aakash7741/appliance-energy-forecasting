[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appliance-energy-forecasting"
version = "1.0.0"
description = "Reproducible hourly appliance-energy forecasting study"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.14,<2",
  "matplotlib>=3.9,<4", "seaborn>=0.13,<1",
  "statsmodels>=0.14.5,<0.15", "scikit-learn>=1.5,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

